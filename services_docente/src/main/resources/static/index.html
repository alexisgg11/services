<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Buscar un contacto</title>
    <style>
        :root {
            color-scheme: light;
            font-family: "Segoe UI", Arial, sans-serif;
            color: #172b4d;
            background: #f3f6fb;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        main {
            width: min(100%, 560px);
            padding: 36px;
            border: 1px solid #e2e8f0;
            border-radius: 18px;
            background: #fff;
            box-shadow: 0 16px 42px #17345a12;
        }

        .eyebrow {
            margin: 0 0 8px;
            color: #176b87;
            font-size: .78rem;
            font-weight: 700;
            letter-spacing: .12em;
            text-transform: uppercase;
        }

        h1 { margin: 0; font-size: clamp(1.8rem, 6vw, 2.35rem); }
        .intro { margin: 10px 0 26px; color: #58677d; line-height: 1.55; }
        .section-title { margin: 0 0 8px; font-size: 1.2rem; }
        .search-intro { margin: 0 0 20px; color: #58677d; line-height: 1.5; }
        label { display: block; margin-bottom: 8px; font-weight: 600; }

        .search-row { display: flex; gap: 10px; }

        input {
            min-width: 0;
            flex: 1;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font: inherit;
        }

        input:focus { outline: 3px solid #176b8728; border-color: #176b87; }

        button {
            padding: 12px 18px;
            border: 0;
            border-radius: 9px;
            background: #176b87;
            color: white;
            font: inherit;
            font-weight: 650;
            cursor: pointer;
        }

        button:hover { background: #10566e; }
        button:disabled { cursor: wait; opacity: .65; }
        #status { min-height: 24px; margin: 18px 0 0; color: #58677d; }
        #results { display: grid; gap: 12px; margin-top: 14px; }

        .result {
            padding: 17px 18px;
            border: 1px solid #dce6ef;
            border-radius: 12px;
            background: #f9fbfd;
        }

        .result h2 { margin: 0 0 12px; font-size: 1.05rem; }
        .detail { display: flex; justify-content: space-between; gap: 16px; padding-top: 9px; color: #58677d; }
        .detail + .detail { margin-top: 8px; border-top: 1px solid #e6edf4; }
        .detail strong { color: #172b4d; text-align: right; }

        @media (max-width: 480px) {
            main { padding: 26px 20px; }
            .search-row { flex-direction: column; }
            button { width: 100%; }
        }
    </style>
</head>
<body>
<main>
    <section aria-labelledby="search-title">
    <p class="eyebrow">Directorio</p>
    <h2 class="section-title" id="search-title">Buscar un contacto</h2>
    <p class="search-intro">Escribe el nombre o apellido para consultar su celular y distrito.</p>

    <form id="search-form">
        <label for="persona">Nombre o apellido</label>
        <div class="search-row">
            <input id="persona" name="persona" type="search" required autocomplete="off">
            <button id="search-button" type="submit">Buscar</button>
        </div>
    </form>

    <p id="status" role="status" aria-live="polite"></p>
    <section id="results" aria-label="Resultados"></section>
    </section>
</main>

<script>
    const form = document.querySelector("#search-form");
    const input = document.querySelector("#persona");
    const button = document.querySelector("#search-button");
    const status = document.querySelector("#status");
    const results = document.querySelector("#results");
    function addDetail(card, label, value) {
        const row = document.createElement("div");
        row.className = "detail";
        const name = document.createElement("span");
        name.textContent = label;
        const content = document.createElement("strong");
        content.textContent = value;
        row.append(name, content);
        card.append(row);
    }

    form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const termino = input.value.trim();
        if (!termino) return;

        button.disabled = true;
        status.textContent = "Buscando…";
        results.replaceChildren();

        try {
            const response = await fetch(`/api/contactos/buscar?persona=${encodeURIComponent(termino)}`);
            if (!response.ok) throw new Error("No se pudo completar la búsqueda.");

            const contactos = await response.json();
            if (contactos.length === 0) {
                status.textContent = "No encontramos contactos con ese nombre o apellido.";
                return;
            }

            status.textContent = contactos.length === 1
                ? "Encontramos 1 contacto:"
                : `Encontramos ${contactos.length} contactos:`;

            for (const contacto of contactos) {
                const card = document.createElement("article");
                card.className = "result";
                const heading = document.createElement("h2");
                heading.textContent = `${contacto.nombre} ${contacto.apellidos}`;
                card.append(heading);
                addDetail(card, "Celular", contacto.celular);
                addDetail(card, "Distrito", contacto.distrito);
                results.append(card);
            }
        } catch {
            status.textContent = "No se pudo conectar con el servicio. Intenta de nuevo.";
        } finally {
            button.disabled = false;
        }
    });
</script>
</body>
</html>
